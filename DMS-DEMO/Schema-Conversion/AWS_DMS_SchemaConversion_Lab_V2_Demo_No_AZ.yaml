AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Low-cost AWS DMS Schema Conversion demo lab - MySQL to PostgreSQL.
  Uses dynamically selected Availability Zones (no hard-coded AZ names).
  Creates public RDS MySQL/PostgreSQL, DMS Schema Conversion resources,
  Data Providers, Secrets Manager secrets, and an S3 conversion bucket.
  LAB ONLY - do not use 0.0.0.0/0 in production.

Parameters:
  ProjectName:
    Type: String
    Default: dms-sc-v2
    Description: Prefix used for lab resource names.

  DBPassword:
    Type: String
    NoEcho: true
    MinLength: 8
    MaxLength: 41
    Default: 'DmsLab123!'
    Description: Master password for both lab databases.

  MySQLInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
    Description: Small MySQL instance for the demo.

  PostgreSQLInstanceClass:
    Type: String
    Default: db.t3.micro
    AllowedValues:
      - db.t3.micro
      - db.t3.small
    Description: Small PostgreSQL instance for the demo.

  VpcCidr:
    Type: String
    Default: 10.20.0.0/16

  PublicSubnet1Cidr:
    Type: String
    Default: 10.20.1.0/24

  PublicSubnet2Cidr:
    Type: String
    Default: 10.20.2.0/24

  PublicSubnet3Cidr:
    Type: String
    Default: 10.20.3.0/24

Resources:

  # ------------------------------------------------------------
  # Networking
  # No hard-coded AvailabilityZone values are used.
  # CloudFormation dynamically selects AZs from the Region.
  # ------------------------------------------------------------
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-vpc'

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-igw'

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select
        - 0
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-1'

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select
        - 1
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-2'

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet3Cidr
      AvailabilityZone: !Select
        - 2
        - !GetAZs ''
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-3'

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-public-rt'

  InternetRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1Route:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnet2Route:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  PublicSubnet3Route:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet3

  # ------------------------------------------------------------
  # Security Group
  # LAB ONLY: intentionally open to the Internet.
  # ------------------------------------------------------------
  DatabaseSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: !Sub '${ProjectName} MySQL PostgreSQL lab access'
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 3306
          ToPort: 3306
          CidrIp: 0.0.0.0/0
          Description: LAB ONLY MySQL
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0
          Description: LAB ONLY PostgreSQL
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0

  # ------------------------------------------------------------
  # RDS subnet group
  # ------------------------------------------------------------
  RDSSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: !Sub '${ProjectName} RDS subnet group'
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # DMS subnet group for Schema Conversion instance profile
  # ------------------------------------------------------------
  DMSSubnetGroup:
    Type: AWS::DMS::ReplicationSubnetGroup
    DependsOn:
      - VPCGatewayAttachment
    Properties:
      ReplicationSubnetGroupIdentifier: !Sub '${ProjectName}-dms-subnet-group'
      ReplicationSubnetGroupDescription: !Sub '${ProjectName} DMS Schema Conversion subnet group'
      SubnetIds:
        - !Ref PublicSubnet1
        - !Ref PublicSubnet2
        - !Ref PublicSubnet3
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # MySQL source
  # ------------------------------------------------------------
  MySQL:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-mysql'
      Engine: mysql
      DBInstanceClass: !Ref MySQLInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      PubliclyAccessible: true
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      DBName: saleslab
      MasterUsername: dmsadmin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-mysql'
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # PostgreSQL target
  # ------------------------------------------------------------
  PostgreSQL:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${ProjectName}-postgres'
      Engine: postgres
      DBInstanceClass: !Ref PostgreSQLInstanceClass
      AllocatedStorage: 20
      StorageType: gp3
      PubliclyAccessible: true
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      DeletionProtection: false
      AutoMinorVersionUpgrade: true
      DBName: saleslab_pg
      MasterUsername: dmsadmin
      MasterUserPassword: !Ref DBPassword
      DBSubnetGroupName: !Ref RDSSubnetGroup
      VPCSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Name
          Value: !Sub '${ProjectName}-postgres'
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # Secrets Manager
  # ------------------------------------------------------------
  MySQLSecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: MySQL
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${ProjectName}/mysql-secret'
      Description: !Sub 'DMS MySQL credentials for ${ProjectName}'
      SecretString: !Sub |
        {
          "username": "dmsadmin",
          "password": "${DBPassword}",
          "port": "3306",
          "host": "${MySQL.Endpoint.Address}"
        }
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  PostgreSQLSecret:
    Type: AWS::SecretsManager::Secret
    DependsOn: PostgreSQL
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      Name: !Sub '${ProjectName}/postgres-secret'
      Description: !Sub 'DMS PostgreSQL credentials for ${ProjectName}'
      SecretString: !Sub |
        {
          "username": "dmsadmin",
          "password": "${DBPassword}",
          "port": "5432",
          "host": "${PostgreSQL.Endpoint.Address}"
        }
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # DMS role to read the database secrets
  # ------------------------------------------------------------
  DMSSecretsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-dms-secrets-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - !Sub 'dms.${AWS::Region}.amazonaws.com'
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: ReadDMSLabSecrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - !Ref MySQLSecret
                  - !Ref PostgreSQLSecret
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # S3 bucket for DMS Schema Conversion artifacts
  # ------------------------------------------------------------
  SchemaConversionBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: DeleteLabArtifacts
            Status: Enabled
            ExpirationInDays: 7
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  SchemaConversionS3Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-sc-s3-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - dms.amazonaws.com
            Action:
              - sts:AssumeRole
      Policies:
        - PolicyName: DMSchemaConversionS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:ListBucket
                  - s3:GetBucketLocation
                  - s3:GetBucketVersioning
                Resource: !GetAtt SchemaConversionBucket.Arn
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${SchemaConversionBucket.Arn}/*'
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # DMS VPC service role
  # ------------------------------------------------------------
  DMSVPCRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-dms-vpc-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - dms.amazonaws.com
            Action:
              - sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonDMSVPCManagementRole
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # DMS Schema Conversion instance profile
  # ------------------------------------------------------------
  SchemaConversionInstanceProfile:
    Type: AWS::DMS::InstanceProfile
    DependsOn:
      - DMSSubnetGroup
      - DMSVPCRole
    Properties:
      InstanceProfileIdentifier: !Sub '${ProjectName}-sc-profile'
      InstanceProfileName: !Sub '${ProjectName}-sc-profile'
      Description: !Sub '${ProjectName} schema conversion profile'
      NetworkType: IPV4
      PubliclyAccessible: true
      SubnetGroupIdentifier: !Ref DMSSubnetGroup
      VpcSecurityGroups:
        - !GetAtt DatabaseSecurityGroup.GroupId
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab

  # ------------------------------------------------------------
  # Source Data Provider - MySQL
  # ------------------------------------------------------------
  MySQLDataProvider:
    Type: AWS::DMS::DataProvider
    DependsOn:
      - MySQL
    Properties:
      DataProviderIdentifier: !Sub '${ProjectName}-mysql-source'
      DataProviderName: !Sub '${ProjectName}-mysql-source'
      Description: MySQL source data provider
      Engine: mysql
      ExactSettings: true
      Settings:
        MySqlSettings:
          ServerName: !GetAtt MySQL.Endpoint.Address
          Port: 3306
          SslMode: none

  # ------------------------------------------------------------
  # Target Data Provider - PostgreSQL
  # ------------------------------------------------------------
  PostgreSQLDataProvider:
    Type: AWS::DMS::DataProvider
    DependsOn:
      - PostgreSQL
    Properties:
      DataProviderIdentifier: !Sub '${ProjectName}-postgres-target'
      DataProviderName: !Sub '${ProjectName}-postgres-target'
      Description: PostgreSQL target data provider
      Engine: postgres
      ExactSettings: true
      Settings:
        PostgreSqlSettings:
          ServerName: !GetAtt PostgreSQL.Endpoint.Address
          Port: 5432
          DatabaseName: saleslab_pg
          SslMode: none

  # ------------------------------------------------------------
  # DMS Migration Project
  # ------------------------------------------------------------
  MigrationProject:
    Type: AWS::DMS::MigrationProject
    DependsOn:
      - SchemaConversionInstanceProfile
      - MySQLDataProvider
      - PostgreSQLDataProvider
      - MySQLSecret
      - PostgreSQLSecret
      - DMSSecretsRole
      - SchemaConversionS3Role
    Properties:
      MigrationProjectIdentifier: !Sub '${ProjectName}-project'
      MigrationProjectName: !Sub '${ProjectName}-project'
      Description: !Sub '${ProjectName} MySQL to PostgreSQL schema conversion'
      InstanceProfileIdentifier: !Ref SchemaConversionInstanceProfile
      SourceDataProviderDescriptors:
        - DataProviderIdentifier: !Ref MySQLDataProvider
          SecretsManagerSecretId: !Ref MySQLSecret
          SecretsManagerAccessRoleArn: !GetAtt DMSSecretsRole.Arn
      TargetDataProviderDescriptors:
        - DataProviderIdentifier: !Ref PostgreSQLDataProvider
          SecretsManagerSecretId: !Ref PostgreSQLSecret
          SecretsManagerAccessRoleArn: !GetAtt DMSSecretsRole.Arn
      SchemaConversionApplicationAttributes:
        S3BucketPath: !Sub 's3://${SchemaConversionBucket}'
        S3BucketRoleArn: !GetAtt SchemaConversionS3Role.Arn
      Tags:
        - Key: Purpose
          Value: DMS-Schema-Conversion-Lab
        - Key: Source
          Value: MySQL
        - Key: Target
          Value: PostgreSQL

Outputs:
  VpcId:
    Description: Lab VPC
    Value: !Ref VPC

  DatabaseSecurityGroupId:
    Description: Security group allowing MySQL and PostgreSQL from 0.0.0.0/0
    Value: !GetAtt DatabaseSecurityGroup.GroupId

  MySQLEndpoint:
    Description: Public MySQL endpoint
    Value: !GetAtt MySQL.Endpoint.Address

  MySQLPort:
    Description: MySQL port
    Value: !GetAtt MySQL.Endpoint.Port

  MySQLDatabase:
    Description: MySQL database name
    Value: saleslab

  MySQLConnectionExample:
    Description: Example MySQL connection
    Value: !Sub 'mysql -h ${MySQL.Endpoint.Address} -P 3306 -u dmsadmin -p saleslab'

  PostgreSQLEndpoint:
    Description: Public PostgreSQL endpoint
    Value: !GetAtt PostgreSQL.Endpoint.Address

  PostgreSQLPort:
    Description: PostgreSQL port
    Value: !GetAtt PostgreSQL.Endpoint.Port

  PostgreSQLDatabase:
    Description: PostgreSQL database name
    Value: saleslab_pg

  PostgreSQLConnectionExample:
    Description: Example PostgreSQL connection
    Value: !Sub 'psql -h ${PostgreSQL.Endpoint.Address} -p 5432 -U dmsadmin -d saleslab_pg'

  MySQLSecretArn:
    Description: MySQL Secrets Manager ARN
    Value: !Ref MySQLSecret

  PostgreSQLSecretArn:
    Description: PostgreSQL Secrets Manager ARN
    Value: !Ref PostgreSQLSecret

  DMSInstanceProfile:
    Description: DMS Schema Conversion instance profile
    Value: !Ref SchemaConversionInstanceProfile

  MySQLDataProvider:
    Description: DMS MySQL source Data Provider
    Value: !Ref MySQLDataProvider

  PostgreSQLDataProvider:
    Description: DMS PostgreSQL target Data Provider
    Value: !Ref PostgreSQLDataProvider

  MigrationProject:
    Description: DMS Schema Conversion migration project
    Value: !Ref MigrationProject

  SchemaConversionBucket:
    Description: S3 bucket used for DMS Schema Conversion artifacts
    Value: !Ref SchemaConversionBucket
